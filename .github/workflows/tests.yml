name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest

      - name: Struktur der Referenzmappe pruefen
        # Belegt, dass die in docs/EXCEL-MAPPING.md dokumentierten Annahmen
        # noch gelten. Siehe docs/DECISIONS.md · R-01.
        run: python werkzeuge/mappe_analysieren.py
